name: Cleanup Old Feeds

on:
  schedule:
    # Runs weekly every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete feeds older than N days'
        required: false
        default: '10'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Cleanup
        run: |
          DAYS="${{ github.event.inputs.days || '10' }}"
          python cleanup_old_feeds.py --days "$DAYS"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sivasubramoniam-js"
          git config --global user.email "122598293+sivasubramoniam-js@users.noreply.github.com"
          git add -A feeds/
          git commit -m "chore: delete feeds older than ${{ github.event.inputs.days || '10' }} days [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash
          git push
