name: Repository Traffic Insights

on:
  schedule:
    - cron: '30 18 * * *' # Daily at 00:00 IST (18:30 UTC)
  workflow_dispatch:

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast Checkout (sparse shallow clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            track_traffic.py
            traffic.csv
            traffic.svg
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Record Traffic Insights
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python track_traffic.py

      - name: Commit and Push Traffic Data
        run: |
          git config --global user.name "sivasubramoniam-js"
          git config --global user.email "122598293+sivasubramoniam-js@users.noreply.github.com"
          git add traffic.csv traffic.svg
          git commit -m "Update repository traffic insights [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash
          git push
